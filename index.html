<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小词汇大闯关 · 千千的单词练习</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 顶部 -->
<header class="topbar">
  <div class="logo">🎯 单词练习</div>
  <div class="topbar-right">
    <button class="btn-settings" id="settingsBtn" title="设置">⚙️</button>
    <span class="progress-text" id="progressText">—</span>
    <button class="btn-sound" id="soundToggle" title="音效开关">🔊</button>
  </div>
</header>

<!-- 主区 -->
<main class="container">

  <!-- 学习状态栏 -->
  <section class="status-bar" id="statusBar">
    <div class="status-item" id="stLearn">📖 待学 <b>0</b></div>
    <div class="status-item" id="stMeaning">词义 <b>0</b></div>
    <div class="status-item" id="stSpell">拼写 <b>0</b></div>
    <div class="status-item" id="stSentence">例句 <b>0</b></div>
    <div class="status-item done" id="stDone">✅ <b>0</b></div>
  </section>

  <!-- 设置面板 -->
  <section class="settings-panel hidden" id="settingsPanel">
    <label>每天学习新单词数：</label>
    <input type="number" id="dailyInput" min="1" max="100" value="10">
    <button class="btn-primary" id="dailySave">保存</button>
    <p class="hint">学习规则：学完隔 1 天考 → 通过隔 3 天考 → 通过隔 7 天考，连续通过 3 次后进入下一考区（间隔继续翻倍：15、31…天）。答错则重新开始。例句区连续通过 3 次即毕业。每个考区可手动「完全掌握」移出，也可恢复。</p>
  </section>

  <!-- 模式选择 -->
  <section class="mode-bar">
    <button class="mode-btn active" data-mode="learn">📖 学习</button>
    <button class="mode-btn" data-mode="meaning">词义待考</button>
    <button class="mode-btn" data-mode="spell">拼写待考</button>
    <button class="mode-btn" data-mode="sentence">例句待考</button>
  </section>

  <!-- 卡片区 -->
  <section class="card-area">
    <div class="card" id="card">
      <!-- 学习/词义模式内容 -->
      <div class="card-word" id="cardWord">—</div>
      <div class="card-cn hidden" id="cardCn">—</div>
      <div class="card-sent hidden" id="cardSent">
        <span id="cardSentText"></span>
        <button class="mini-sound" id="sentSoundBtn" title="听例句">🔊</button>
      </div>
      <div class="card-cnsent hidden" id="cardCnSent"></div>
    </div>

    <!-- 学习模式：学会了按钮 -->
    <div class="learn-area hidden" id="learnArea">
      <button class="btn-learn" id="learnDoneBtn">✅ 学会了</button>
    </div>

    <!-- 词义模式：认识/不会 -->
    <div class="quiz-area hidden" id="quizArea">
      <button class="btn-know" id="knowBtn">✅ 认识</button>
      <button class="btn-dontknow" id="dontKnowBtn">❌ 不会</button>
    </div>

    <!-- 拼写输入 -->
    <div class="spell-area hidden" id="spellArea">
      <input type="text" id="spellInput" placeholder="输入英文单词" autocomplete="off" autocapitalize="off">
      <button class="btn-primary" id="spellCheck">检查</button>
      <div class="feedback hidden" id="spellFeedback"></div>
    </div>

    <!-- 例句挖空 -->
    <div class="sentence-area hidden" id="sentenceArea">
      <div class="blank-sentence" id="blankSentence"></div>
      <input type="text" id="sentenceInput" placeholder="填入缺失的单词" autocomplete="off">
      <button class="btn-primary" id="sentenceCheck">检查</button>
      <div class="feedback hidden" id="sentenceFeedback"></div>
    </div>

    <!-- 完全掌握 -->
    <div class="master-area hidden" id="masterArea">
      <button class="btn-master" id="masterBtn">🎓 完全掌握（移出本考区）</button>
    </div>

    <!-- 恢复已移出 -->
    <div class="restore-area hidden" id="restoreArea">
      <button class="btn-restore" id="restoreBtn">↩️ 恢复已移出的单词</button>
      <div class="restore-list hidden" id="restoreList"></div>
    </div>
  </section>

  <!-- 操作按钮 -->
  <section class="action-bar">
    <button class="btn-flip" id="flipBtn">👁️ 显示答案</button>
    <button class="btn-next" id="nextBtn">下一个 ➡️</button>
  </section>

  <!-- 结果面板 -->
  <section class="result-panel hidden" id="resultPanel">
    <h2 id="resultTitle">🎉 完成！</h2>
    <p id="resultText"></p>
    <button class="btn-primary" id="restartBtn">继续</button>
  </section>

</main>

<footer class="foot">千千专用 · 三年级升四年级词汇练习 · 间隔记忆</footer>

<script src="js/app.js"></script>
</body>
</html>
